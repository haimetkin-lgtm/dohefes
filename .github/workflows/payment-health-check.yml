name: Payment Health Check

on:
  schedule:
    - cron: "30 * * * *"  # כל שעה ב-:30
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.summary.outputs.issue }}
      reason: ${{ steps.summary.outputs.reason }}

    steps:
      - name: Test CORS preflight
        id: cors
        run: |
          HEADERS=$(curl -sI --max-time 15 \
            -X OPTIONS \
            "$SUPABASE_URL/functions/v1/dohefes-create-payment-order" \
            -H "Origin: https://haimetkin-lgtm.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: x-client-info, content-type, authorization, Idempotency-Key")
          echo "$HEADERS"
          if echo "$HEADERS" | grep -qi "x-client-info"; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Summarize issues
        id: summary
        run: |
          ISSUE="false"
          REASON=""
          if [ "${{ steps.cors.outputs.ok }}" = "false" ]; then
            ISSUE="true"
            REASON="CORS שבור - תשלומים לא יכולים להתחיל"
          fi
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT

      - name: Send WhatsApp alert
        if: steps.summary.outputs.issue == 'true'
        run: |
          curl -s -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json" \
            -u "$TWILIO_SID:$TWILIO_TOKEN" \
            --data-urlencode "From=whatsapp:$TWILIO_WHATSAPP_NUMBER" \
            --data-urlencode "To=whatsapp:+972523728828" \
            --data-urlencode "Body=⚠️ *דוחות אפס - תקלת תשלום*

סיבה: ${{ steps.summary.outputs.reason }}

לוגים:
https://supabase.com/dashboard/project/giygjmacxquucwexmfdd/logs/edge-functions"
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}

      - name: Fail job if issue found
        if: steps.summary.outputs.issue == 'true'
        run: exit 1
